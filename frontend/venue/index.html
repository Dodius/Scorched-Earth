<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorched Earth AR</title>
    <link rel="stylesheet" href="/venue/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="table-panel">
        <div>
          <p class="eyebrow" id="tableLabel">Venue table</p>
          <h1>Scorched Earth AR</h1>
        </div>
        <div class="status-pill" id="connectionStatus">Connecting</div>
      </section>

      <section class="grid">
        <article class="panel games-panel">
          <div class="panel-head">
            <h2>Table Games</h2>
            <div class="panel-tools">
              <button class="icon-button" id="refreshGames" title="Refresh games">↻</button>
              <button class="icon-button danger-icon" id="clearGames" title="Clear table games">×</button>
            </div>
          </div>
          <div id="gamesList" class="games-list"></div>
        </article>

        <article class="panel create-panel">
          <div class="panel-head">
            <h2>Host Init</h2>
          </div>
          <form id="createForm" class="form">
            <div class="form-field">
              <span>Field size</span>
              <div class="field-size-picker">
                <label class="field-tile">
                  <input type="radio" name="fieldSize" value="small" />
                  <span class="field-tile__preview field-tile__preview--small"></span>
                  <span class="field-tile__name">Small</span>
                  <span class="field-tile__dim">0.6 × 0.45 m</span>
                </label>
                <label class="field-tile">
                  <input type="radio" name="fieldSize" value="medium" checked />
                  <span class="field-tile__preview field-tile__preview--medium"></span>
                  <span class="field-tile__name">Medium</span>
                  <span class="field-tile__dim">0.8 × 0.6 m</span>
                </label>
                <label class="field-tile field-tile--large">
                  <input type="radio" name="fieldSize" value="large" />
                  <span class="field-tile__preview field-tile__preview--large"></span>
                  <span class="field-tile__name">Large</span>
                  <span class="field-tile__dim">1.0 × 0.75 m</span>
                </label>
              </div>
            </div>
            <label>
              <span>Scene</span>
              <select name="scenePreset">
                <option value="classic-grid" selected>Classic Grid</option>
                <option value="pub-table">Pub Table</option>
                <option value="crater-field">Crater Field</option>
              </select>
            </label>
            <label>
              <span>Players</span>
              <input name="maxPlayers" type="number" min="2" max="6" value="6" />
            </label>
            <label>
              <span>Bomb</span>
              <select name="bombMode">
                <option value="normal" selected>Normal Bomb</option>
                <option value="leap-frog">Leap-Frog Bomb</option>
              </select>
            </label>
            <button class="primary" type="submit">Create Game</button>
          </form>
        </article>
      </section>

      <section class="panel join-panel" id="joinPanel" hidden>
        <div class="panel-head">
          <h2>Join Game</h2>
          <span class="game-code" id="selectedGameCode"></span>
        </div>
        <form id="joinForm" class="join-form">
          <img id="avatarPreview" alt="" class="avatar-preview" />
          <label>
            <span>Nickname</span>
            <input id="usernameInput" name="username" maxlength="24" autocomplete="nickname" placeholder="Tank pilot" required />
          </label>
          <button class="primary" type="submit">Join Lobby</button>
        </form>
      </section>

      <section class="panel lobby-panel" id="lobbyPanel" hidden>
        <div class="panel-head">
          <h2>Lobby</h2>
          <span class="game-code" id="lobbyGameCode"></span>
        </div>
        <div id="playersList" class="players-list"></div>
        <div class="lobby-actions">
          <button class="primary" id="startGameButton">Start Game</button>
          <p id="lobbyHint">Solo test games are allowed.</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/venue/join.js"></script>
  </body>
</html>
