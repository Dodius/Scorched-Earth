<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorched Earth AR</title>
    <link rel="stylesheet" href="/ar/styles.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/",
        "threex": "https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/three.js/build/ar-threex.mjs"
      }
    }
    </script>
  </head>
  <body>
    <div id="topHud" class="top-hud">
      <span id="markerStatus">Find marker</span>
      <span id="gameStatus">Connecting</span>
      <span id="turnTimer" hidden></span>
    </div>

    <div id="finder" class="finder" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </div>

    <div id="focusReticle" class="focus-reticle" hidden></div>

    <div id="controls" class="controls" hidden>
      <div class="control-row">
        <button id="rotateLeft" title="Rotate left">&lsaquo;</button>
        <strong id="azimuthValue">0 deg</strong>
        <button id="rotateRight" title="Rotate right">&rsaquo;</button>
      </div>
      <label>
        <span>Elevation <strong id="elevationValue">45 deg</strong></span>
        <input id="elevationInput" type="range" min="5" max="85" value="45" />
      </label>
      <label>
        <span>Power <strong id="powerValue">50%</strong></span>
        <input id="powerInput" type="range" min="10" max="100" value="50" />
      </label>
      <button id="fireButton" class="fire">Fire</button>
    </div>

    <div id="waitingOverlay" class="waiting">Waiting for game state</div>
    <div id="gameOver" class="game-over" hidden></div>
    <div id="livesPanel" class="lives-panel"></div>
    <div id="debugPanel" class="debug-panel" hidden></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/ar/game.js"></script>
  </body>
</html>
