<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorched Earth AR</title>
    <link rel="stylesheet" href="/venue/styles.css" />
  </head>
  <body>

    <!-- Screen 1: Landing — callsign + role choice -->
    <section id="screenStart" class="screen">
      <header class="brand">
        <p class="eyebrow" id="tableLabel">table</p>
        <h1>Scorched<br>Earth</h1>
        <span id="connStatus" class="conn-status">Connecting…</span>
      </header>

      <div id="rejoinCard" class="rejoin-card" hidden>
        <img id="rejoinAvatar" alt="" />
        <div class="rejoin-info">
          <strong id="rejoinName"></strong>
          <small id="rejoinGameLabel"></small>
        </div>
        <button id="rejoinBtn" class="btn-outline">Rejoin</button>
      </div>

      <div class="name-row">
        <img id="avatarPreview" src="" alt="" class="avatar-sm" />
        <input id="usernameInput" type="text" placeholder="Your callsign"
               maxlength="24" autocomplete="nickname" spellcheck="false" />
      </div>

      <div class="role-row">
        <button id="hostBtn" class="role-btn">
          <span class="role-icon">⚔</span>
          <strong>Host</strong>
          <small>Create game</small>
        </button>
        <button id="joinBtn" class="role-btn">
          <span class="role-icon">🎯</span>
          <strong>Join</strong>
          <small>Enter code</small>
        </button>
      </div>
    </section>

    <!-- Screen 2: Host — configure & create -->
    <section id="screenHost" class="screen" hidden>
      <header class="screen-head">
        <button id="backFromHost" class="back-btn">‹ Back</button>
        <h2>New Game</h2>
      </header>
      <form id="createForm" class="form">
        <fieldset>
          <legend>Field size</legend>
          <div class="field-size-picker">
            <label class="field-tile">
              <input type="radio" name="fieldSize" value="small" />
              <span class="field-tile__preview field-tile__preview--small"></span>
              <span>Small</span>
            </label>
            <label class="field-tile">
              <input type="radio" name="fieldSize" value="medium" checked />
              <span class="field-tile__preview field-tile__preview--medium"></span>
              <span>Medium</span>
            </label>
            <label class="field-tile">
              <input type="radio" name="fieldSize" value="large" />
              <span class="field-tile__preview field-tile__preview--large"></span>
              <span>Large</span>
            </label>
          </div>
        </fieldset>
        <label>
          <span>Max players</span>
          <input name="maxPlayers" type="number" min="1" max="6" value="6" />
        </label>
        <details>
          <summary>Advanced options</summary>
          <div class="details-body">
            <label>
              <span>Scene</span>
              <select name="scenePreset">
                <option value="classic-grid" selected>Classic Grid</option>
                <option value="pub-table">Pub Table</option>
                <option value="crater-field">Crater Field</option>
              </select>
            </label>
            <label>
              <span>Bomb type</span>
              <select name="bombMode">
                <option value="normal" selected>Normal</option>
                <option value="leap-frog">Leap-Frog</option>
              </select>
            </label>
          </div>
        </details>
        <button class="primary" type="submit">Create &amp; Enter Lobby</button>
      </form>
    </section>

    <!-- Screen 3: Join by code -->
    <section id="screenJoin" class="screen" hidden>
      <header class="screen-head">
        <button id="backFromJoin" class="back-btn">‹ Back</button>
        <h2>Join Game</h2>
      </header>
      <form id="joinForm" class="form">
        <label>
          <span>Game code</span>
          <input id="gameCodeInput" type="text" placeholder="Ask the host"
                 maxlength="10" spellcheck="false" autocorrect="off" autocapitalize="off" />
        </label>
        <button class="primary" type="submit">Enter Lobby</button>
      </form>
    </section>

    <!-- Screen 4: Lobby -->
    <section id="screenLobby" class="screen" hidden>
      <header class="screen-head">
        <h2>Lobby</h2>
        <div class="code-badge">
          <small>Game code</small>
          <strong id="lobbyCode"></strong>
        </div>
      </header>
      <div id="playersList" class="players-list"></div>
      <div class="lobby-foot">
        <button id="startBtn" class="primary" hidden>Start Game</button>
        <p id="lobbyHint" class="hint"></p>
        <button id="leaveBtn" class="btn-outline btn-full">Leave Lobby</button>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/venue/join.js"></script>
  </body>
</html>
