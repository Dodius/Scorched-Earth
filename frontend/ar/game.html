<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorched Earth AR</title>
    <link rel="stylesheet" href="/ar/styles.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <div id="topHud" class="top-hud">
      <span id="markerStatus">Find marker</span>
      <span id="gameStatus">Connecting</span>
    </div>

    <div id="finder" class="finder" aria-hidden="true">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </div>

    <div id="focusReticle" class="focus-reticle" hidden></div>

    <div id="controls" class="controls" hidden>
      <div class="control-row">
        <button id="rotateLeft" title="Rotate left">&lsaquo;</button>
        <strong id="azimuthValue">0 deg</strong>
        <button id="rotateRight" title="Rotate right">&rsaquo;</button>
      </div>
      <label>
        <span>Elevation <strong id="elevationValue">45 deg</strong></span>
        <input id="elevationInput" type="range" min="5" max="85" value="45" />
      </label>
      <label>
        <span>Power <strong id="powerValue">50%</strong></span>
        <input id="powerInput" type="range" min="10" max="100" value="50" />
      </label>
      <button id="fireButton" class="fire">Fire</button>
    </div>

    <div id="waitingOverlay" class="waiting">Waiting for game state</div>
    <div id="gameOver" class="game-over" hidden></div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 30;"
    >
      <a-marker
        id="mainMarker"
        type="pattern"
        url="/ar/markers/pattern-ARFly_binary_clean_05.patt"
      >
        <a-entity id="markerProbe">
          <a-cylinder
            radius="0.045"
            height="0.025"
            position="0 0.02 0"
            color="#ffdc4f"
            material="shader: flat"
          ></a-cylinder>
          <a-cone
            radius-bottom="0.055"
            radius-top="0"
            height="0.16"
            position="0 0.12 0"
            color="#ff4f36"
            material="shader: flat"
          ></a-cone>
        </a-entity>
        <a-entity id="battlefield" position="0 0 0" scale="1 1 1"></a-entity>
      </a-marker>
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="0 1 1"></a-entity>
      <a-entity camera></a-entity>
    </a-scene>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/ar/game.js"></script>
  </body>
</html>
